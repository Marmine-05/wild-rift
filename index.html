<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wild Rift Clips</title>
<link rel="icon" type="image/svg+xml"
href="https://commons.wikimedia.org/wiki/Special:Redirect/file/League_of_Legends_Wild_Rift_logo.svg">
<style>
:root{
  --bg:#fff0ed;
  --card:#ffffff;
  --ink:#471b1b;
  --mute:#986565;
  --pink:#e52222;
  --lav:#ff6b35;
  --mint:#ffc2a8;
  --line:#f2c5bd;
  --shadow:0 6px 20px rgba(220,25,25,.22);
  color-scheme:light
}

@media (prefers-color-scheme: dark) {
    :root {
        --bg: #211820;
        --card: #30232e;
        --ink: #fff0f5;
        --mute: #c3a5b6;

        --pink: #e6a4c1;
        --lav: #c3a9df;
        --mint: #543747;

        --line: #594050;
        --shadow: 0 6px 22px rgba(0, 0, 0, .35);

        color-scheme: dark;
    }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;min-height:100vh}
header{text-align:center;padding:40px 16px 10px}
h1 {
    margin: 0;
    font-family: "Baloo 2", "Trebuchet MS", sans-serif;
    font-size: clamp(30px, 7vw, 48px);
    background: linear-gradient(
        90deg,
        #c77d9e,
        #d9a9c7,
        #b9a0d2,
        #e4b8c9
    );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}
.sub{color:var(--mute);margin:4px 0 0}
main{max-width:1000px;margin:0 auto;padding:16px}
.bar{text-align:center;margin:10px 0 20px}
.bar input{width:100%;max-width:340px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 18px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s;border:0;padding:0;text-align:left;color:inherit;font:inherit;width:100%}
.card:hover,.card:focus-visible{transform:translateY(-4px) rotate(-.5deg);outline:3px solid var(--lav)}
.thumb{position:relative;aspect-ratio:16/9;background:#000}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.play {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #d98da9, #b9a0d2);
    display: grid;
    place-items: center;
    color: white;
    font-size: 20px;
    padding-left: 3px;
    box-shadow: 0 4px 15px rgba(174, 116, 150, .35);
}
.info{padding:12px 14px 14px}
.info h3{margin:0 0 6px;font-size:17px}
.tag {
    display: inline-block;
    background: var(--mint);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 12px;
    font-weight: 700;
}
.info p{margin:8px 0 0;color:var(--mute);font-size:14px}
.empty{text-align:center;color:var(--mute);padding:50px 10px}
dialog{border:0;border-radius:22px;padding:0;max-width:min(900px,94vw);width:100%;background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
dialog::backdrop {
    background: rgba(65, 35, 55, .65);
}
.player{aspect-ratio:16/9;background:#000}
.player iframe,.player video{width:100%;height:100%;border:0;display:block}
.dinfo{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 16px}
.dinfo h3{margin:0 0 6px}
.dinfo p{margin:8px 0 0;color:var(--mute);font-size:14px}
.dinfo button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer}
footer{text-align:center;color:var(--mute);padding:24px;font-size:13px}
  header {
    position: relative;
    text-align: center;
    padding: 40px 16px 10px;
}

.caitlyn-art {
    position: absolute;
    top: 12px;
    right: 25px;
    width: 90px;
    height: 90px;
    overflow: hidden;
    border-radius: 50%;
     border: 2px solid #e5b6cb;
    box-shadow: 0 0 18px rgba(217, 141, 169, .4);
    z-index: 3;
}

.caitlyn-art img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 20%;
}

@media (max-width: 600px) {
    .caitlyn-art {
        width: 42px;
        height: 42px;
        top: 8px;
    }
  .caitlyn-art:not(.caitlyn-left) {
        right: 8px;
    }
  .caitlyn-left {
        left: 8px;
        right: auto;
    }

    h1 {
        font-size: 27px;
        max-width: 75%;
        margin: 15px auto 0;
    }

    header {
        padding-top: 65px;
    }
}
  .caitlyn-art {
    text-decoration: none;
    cursor: pointer;
    transition: transform .25s ease, box-shadow .25s ease;
}

.caitlyn-art:hover {
    transform: scale(1.08);
    box-shadow: 0 0 22px rgba(217, 141, 169, .65);
}
</style>
</head>
<body>
<header>
    <h1>Mary's Wild Rift Clips</h1>
    <p class="sub">Pentakills, outplays and random clips</p>

    <a href="https://www.tiktok.com/@emeriakira"
   class="caitlyn-art"
   target="_blank"
   rel="noopener noreferrer">

    <img
        src="https://pbs.twimg.com/media/GxOjM8FWwAEBS46?format=webp&name=large"
        alt="Caitlyn"
    >
</a>
</header>
<main>
  <div class="bar"><input type="search" id="q" placeholder="Search by title or champion" aria-label="Search clips"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No clips yet, check back soon 💖</div>
</main>
<footer>Made with 🩷 for Mary</footer>
<dialog id="dlg"><div class="player" id="player"></div><div class="dinfo"><div><h3 id="pt"></h3><span class="tag" id="pc"></span><p id="pd"></p></div><button id="close">Close</button></div></dialog>

<script type="application/json" id="vdata">[{"type":"youtube","ref":"c2VqPawyXBk","title":"Yunara Pentakill","champ":"Yunara","desc":""},{"type":"youtube","ref":"GTNYr8pSYW0","title":"Yunara Pentakill 2","champ":"Yunara","desc":""},{"type":"youtube","ref":"mOCzv2ggIBw","title":"Varus Blind Dragon Steal","champ":"Varus","desc":""},{"type":"youtube","ref":"-pRzQXdeZV0","title":"Ahri Pentakill","champ":"Ahri","desc":""},{"type":"youtube","ref":"0RmcgwgMYH4","title":"Varus Pentakill","champ":"Varus","desc":""},{"type":"youtube","ref":"L4qRPY4pojw","title":"Varus Pentakill 2","champ":"Varus","desc":""},{"type":"youtube","ref":"NuzdS-o1Dv4","title":"Varus Pentakill 3","champ":"Varus","desc":""},{"type":"youtube","ref":"vbLApmwFqs0","title":"Jinx Pentakill","champ":"Jinx","desc":""},{"type":"youtube","ref":"rw7rgf7K9ps","title":"Jinx Pentakill 2","champ":"Jinx","desc":""},{"type":"youtube","ref":"RUIiGTVFsOU","title":"Karma Outplay","champ":"Karma","desc":""},{"type":"youtube","ref":"5K1ds6nM_KU","title":"Kog'maw Pentakill","champ":"Kog'maw","desc":""},{"type":"youtube","ref":"31Sr317B5bw","title":"Riven Pentakill","champ":"Riven","desc":""},{"type":"youtube","ref":"xJskkxlgT2w","title":"Ahri Outplay","champ":"Ahri","desc":""},{"type":"youtube","ref":"rjUMeGZWiho","title":"Ahri Outplay 2","champ":"Ahri","desc":""},{"type":"youtube","ref":"IoD3QlUqozM","title":"Pyke Pentakill","champ":"Pyke","desc":""},{"type":"youtube","ref":"t3WKFldmY1c","title":"Caitlyn Q","champ":"Caitlyn","desc":""},{"type":"youtube","ref":"xqO9cwNEHdk","title":"Kai'sa Quadrakill","champ":"Kai'sa","desc":""},{"type":"youtube","ref":"n-kna3vSfqw","title":"Miss Fortune Pentakill","champ":"Miss Fortune","desc":""},{"type":"youtube","ref":"qENj9VvZYuk","title":"Jinx Pentakill 3","champ":"Jinx","desc":""}]</script>
<script>
var videos = [];
try { videos = JSON.parse(document.getElementById('vdata').textContent) || []; } catch (e) {}
var $ = function (id) { return document.getElementById(id); };
function fileUrl(ref) { return ref.split('/').map(encodeURIComponent).join('/'); }

function render() {
  var q = $('q').value.trim().toLowerCase();
  var list = videos.filter(function (v) { return !q || (v.title + ' ' + (v.champ || '')).toLowerCase().indexOf(q) > -1; });
  var grid = $('grid'); grid.textContent = '';
  $('empty').hidden = list.length > 0;
  list.forEach(function (v) {
    var c = document.createElement('button'); c.className = 'card';
    var t = document.createElement('div'); t.className = 'thumb';
    if (v.type === 'youtube') {
      var img = document.createElement('img'); img.loading = 'lazy'; img.alt = '';
      img.src = 'https://i.ytimg.com/vi/' + v.ref + '/hqdefault.jpg'; t.appendChild(img);
    } else {
      var vid = document.createElement('video'); vid.preload = 'metadata'; vid.muted = true;
      vid.src = fileUrl(v.ref) + '#t=0.5'; t.appendChild(vid);
    }
    var p = document.createElement('div'); p.className = 'play'; p.textContent = '▶'; t.appendChild(p);
    var info = document.createElement('div'); info.className = 'info';
    var h = document.createElement('h3'); h.textContent = v.title; info.appendChild(h);
    if (v.champ) { var tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = v.champ; info.appendChild(tag); }
    c.appendChild(t); c.appendChild(info);
    c.onclick = function () { play(v); };
    grid.appendChild(c);
  });
}

function play(v) {
  var box = $('player'); box.textContent = '';
  if (v.type === 'youtube') {
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/' + v.ref + '?autoplay=1&rel=0';
    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen'; f.allowFullscreen = true; f.title = v.title;
    box.appendChild(f);
  } else {
    var m = document.createElement('video'); m.src = fileUrl(v.ref); m.controls = true; m.autoplay = true; m.playsInline = true;
    box.appendChild(m);
  }
  $('pt').textContent = v.title; $('pc').textContent = v.champ || ''; $('pc').hidden = !v.champ; $('pd').textContent = v.desc || '';
  $('dlg').showModal();
}
$('close').onclick = function () { $('dlg').close(); };
$('dlg').addEventListener('close', function () { $('player').textContent = ''; });
$('dlg').addEventListener('click', function (e) { if (e.target === $('dlg')) $('dlg').close(); });
$('q').oninput = render;
render();
</script>
</body>
</html>
